<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<title>Focus meter</title>
<rect width="900" height="340" rx="14" fill="#282828"/><rect x="1" y="1" width="898" height="338" rx="13" fill="none" stroke="#504945" stroke-width="2"/>
<text x="40" y="52" font-size="16" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace"><tspan fill="#b8bb26">shareef@gruvbox</tspan><tspan fill="#928374">:</tspan><tspan fill="#83a598">~</tspan><tspan fill="#fe8019">$ </tspan><tspan fill="#ebdbb2">focus --meter</tspan></text>
<text x="40" y="108" font-size="15" fill="#ebdbb2" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace">Python</text><rect x="220" y="92" width="600" height="22" rx="5" fill="#3c3836"/><rect x="220" y="92" width="0" height="22" rx="5" fill="#fb4934"><animate attributeName="width" from="0" to="540" dur="1.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></rect><text x="840" y="108" font-size="15" font-weight="700" fill="#fb4934" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace">90%</text>
<text x="40" y="154" font-size="15" fill="#ebdbb2" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace">Data / Pandas</text><rect x="220" y="138" width="600" height="22" rx="5" fill="#3c3836"/><rect x="220" y="138" width="0" height="22" rx="5" fill="#fe8019"><animate attributeName="width" from="0" to="510" dur="1.2s" begin="0.45s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></rect><text x="840" y="154" font-size="15" font-weight="700" fill="#fe8019" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace">85%</text>
<text x="40" y="200" font-size="15" fill="#ebdbb2" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace">AI &amp; ML</text><rect x="220" y="184" width="600" height="22" rx="5" fill="#3c3836"/><rect x="220" y="184" width="0" height="22" rx="5" fill="#fabd2f"><animate attributeName="width" from="0" to="480" dur="1.2s" begin="0.7s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></rect><text x="840" y="200" font-size="15" font-weight="700" fill="#fabd2f" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace">80%</text>
<text x="40" y="246" font-size="15" fill="#ebdbb2" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace">Linux &amp; Bash</text><rect x="220" y="230" width="600" height="22" rx="5" fill="#3c3836"/><rect x="220" y="230" width="0" height="22" rx="5" fill="#b8bb26"><animate attributeName="width" from="0" to="450" dur="1.2s" begin="0.95s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></rect><text x="840" y="246" font-size="15" font-weight="700" fill="#b8bb26" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace">75%</text>
<text x="40" y="292" font-size="15" fill="#ebdbb2" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace">Backend / Flask</text><rect x="220" y="276" width="600" height="22" rx="5" fill="#3c3836"/><rect x="220" y="276" width="0" height="22" rx="5" fill="#83a598"><animate attributeName="width" from="0" to="390" dur="1.2s" begin="1.2s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></rect><text x="840" y="292" font-size="15" font-weight="700" fill="#83a598" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace">65%</text>
<text x="40" y="318" font-size="12" fill="#928374" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace"># self-rated, always going up</text>
</svg>